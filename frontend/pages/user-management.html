<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCHOLA - User Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="core">

  <div class="topbar">
  <h1>SCHOLA</h1>
  <div class="nav">
    <a href="user-management.html">Users</a>
    <a href="course-management.html">Courses</a>
    <a href="department-management.html">Departments</a>
    <span id="welcome"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</div>

  <div class="content">
    <h2>User Management</h2>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by username, email, or role">
      <button id="addBtn">Add user</button>
    </div>

    <div id="pageMessage" class="message"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>
  </div>

  <!-- popup form for add / edit -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Add user</h2>

      <form id="userForm">
        <input type="hidden" id="userId">

        <label for="username">Username</label>
        <input type="text" id="username">

        <label for="email">Email</label>
        <input type="email" id="email">

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password">
        <div class="hint" id="passwordHint"></div>

        <label for="role">Role</label>
        <select id="role">
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
          <option value="Student">Student</option>
        </select>

        <label for="status">Account status</label>
        <select id="status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <div id="formMessage" class="message"></div>

        <div class="modal-buttons">
          <button type="submit">Save</button>
          <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/userManagement.js"></script>
</body>
</html>
